<section class="mx-auto max-w-5xl px-6 py-12 md:px-10 lg:py-20">
  <h1 class="font-league-spartan text-3xl font-semibold">Projets</h1>
  <p class="text-muted-foreground mt-2">
    Quelques projets développés récemment, avec le contexte, la stack et les défis rencontrés.
  </p>

  <div class="mt-10 flex flex-col gap-8">
    @for (projet of projets; track projet.id) {
      <a
        [routerLink]="['/projets', projet.id]"
        class="group overflow-hidden rounded-2xl bg-white shadow-lg transition hover:shadow-xl lg:flex"
      >
        <div class="aspect-video overflow-hidden lg:aspect-auto lg:w-2/5">
          <img
            [src]="projet.image"
            [alt]="projet.titre"
            class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
          />
        </div>

        <div class="flex flex-1 flex-col justify-center p-6 lg:p-8">
          <div class="flex items-center justify-between gap-4">
            <h2 class="font-league-spartan text-xl font-semibold">{{ projet.titre }}</h2>
            <span
              class="bg-muted text-muted-foreground shrink-0 rounded-full px-3 py-1 text-xs font-medium"
            >
              {{ projet.statut }}
            </span>
          </div>

          <p class="text-muted-foreground mt-2 text-sm">{{ projet.contexte }}</p>

          <div class="mt-4 flex flex-wrap gap-2">
            @for (tech of projet.stack; track tech) {
              <span class="rounded-full bg-[#428EE0]/10 px-2.5 py-1 text-xs font-medium text-[#428EE0]">
                {{ tech }}
              </span>
            }
          </div>

          <span class="mt-4 inline-flex items-center gap-1 text-sm font-medium text-[#428EE0]">
            Voir le projet →
          </span>
        </div>
      </a>
    }
  </div>
</section>
