<section class="mx-auto max-w-2xl px-6 py-12 text-center md:px-10 lg:py-20">
  <h1 class="font-league-spartan text-3xl font-semibold">Contact</h1>
  <p class="text-muted-foreground mt-2">
    Une question, une opportunité ? N'hésite pas à me contacter.
  </p>

  <div class="mt-10 flex flex-col items-center gap-4 sm:flex-row sm:justify-center">
    <a
      [href]="mailtoHref"
      class="flex items-center gap-2 rounded-full bg-[#428EE0] px-6 py-3 font-medium text-white hover:brightness-90"
    >
      <ng-icon name="lucideMail" size="18" />
      Email
    </a>

    <a
      href="https://www.linkedin.com/in/thomas-bruston-0401a7315/"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center gap-2 rounded-full border border-[#428EE0] px-6 py-3 font-medium text-[#428EE0] hover:bg-[#428EE0]/10"
    >
      <ng-icon name="faBrandLinkedinIn" size="18" />
      LinkedIn
    </a>

    <a
      href="https://github.com/thomas-bruston"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center gap-2 rounded-full border border-[#428EE0] px-6 py-3 font-medium text-[#428EE0] hover:bg-[#428EE0]/10"
    >
      <ng-icon name="faBrandGithub" size="18" />
      GitHub
    </a>
  </div>
</section>
