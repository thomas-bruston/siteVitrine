<div class="flex min-h-dvh flex-col">
  <header>
    <nav class="grid grid-cols-[1fr_auto_1fr] items-center gap-4 px-6 py-4 md:px-10">
      <a routerLink="/" class="text-lg font-semibold">Thomas Bruston</a>

      <ul class="flex gap-6 text-sm">
        <li>
          <a
            routerLink="/"
            routerLinkActive="text-foreground font-medium"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            Accueil
          </a>
        </li>
        <li>
          <a
            routerLink="/projets"
            routerLinkActive="text-foreground font-medium"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            Projets
          </a>
        </li>
        <li>
          <a
            routerLink="/a-propos"
            routerLinkActive="text-foreground font-medium"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            À propos
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="text-foreground font-medium"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            Contact
          </a>
        </li>
      </ul>

      <a
        hlmBtn
        size="sm"
        routerLink="/contact"
        class="justify-self-end bg-[#428EE0] text-white hover:brightness-90"
      >
        Me contacter
      </a>
    </nav>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer>
    <div class="flex items-center justify-between px-6 py-6 md:px-10">
      <div class="flex gap-3">
        <a
          href="https://www.linkedin.com/in/thomas-bruston-0401a7315/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          class="flex size-9 items-center justify-center rounded-full bg-[#428EE0] text-white hover:brightness-90"
        >
          <ng-icon name="faBrandLinkedinIn" size="16" />
        </a>
        <a
          href="https://github.com/thomas-bruston"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          class="flex size-9 items-center justify-center rounded-full bg-[#428EE0] text-white hover:brightness-90"
        >
          <ng-icon name="faBrandGithub" size="16" />
        </a>
      </div>

      <p class="text-sm text-muted-foreground">© {{ currentYear }} Thomas Bruston</p>
    </div>
  </footer>
</div>
