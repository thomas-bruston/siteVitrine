<div class="flex min-h-dvh flex-col">
  <header>
    <nav class="grid grid-cols-[1fr_auto_1fr] items-center gap-4 px-6 py-1.5 md:px-10 lg:py-4">
      <a routerLink="/" class="text-muted-foreground text-md font-semibold">Thomas Bruston</a>

      <ul class="hidden gap-6 text-sm lg:flex">
        <li>
          <a
            routerLink="/"
            routerLinkActive="text-foreground font-medium"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            Accueil
          </a>
        </li>
        <li>
          <a
            routerLink="/projets"
            routerLinkActive="text-foreground font-medium"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            Projets
          </a>
        </li>
        <li>
          <a
            routerLink="/a-propos"
            routerLinkActive="text-foreground font-medium"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            À propos
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="text-foreground font-medium"
            class="text-muted-foreground hover:text-[#428EE0]"
          >
            Contact
          </a>
        </li>
      </ul>

      <div class="col-start-3 flex items-center justify-self-end gap-3">
        <a
          hlmBtn
          size="sm"
          routerLink="/contact"
          class="hidden bg-[#428EE0] text-white hover:brightness-90 lg:inline-flex"
        >
          Me contacter
        </a>

        <hlm-sheet #sheet="hlmSheet" class="lg:hidden">
          <button
            hlmSheetTrigger
            hlmBtn
            variant="ghost"
            size="icon-lg"
            aria-label="Ouvrir le menu"
            class="translate-x-2 bg-[#428EE0] text-white hover:brightness-90"
          >
            <ng-icon name="lucideMenu" size="26" />
          </button>
          <hlm-sheet-content *hlmSheetPortal="let ctx" side="right" class="w-72">
            <hlm-sheet-header>
              <h3 hlmSheetTitle>Navigation</h3>
            </hlm-sheet-header>

            <nav class="mt-6 flex flex-col gap-5 px-4 text-base">
              <a
                routerLink="/"
                routerLinkActive="text-foreground font-medium"
                [routerLinkActiveOptions]="{ exact: true }"
                class="text-muted-foreground hover:text-[#428EE0]"
                (click)="sheet.close()"
              >
                Accueil
              </a>
              <a
                routerLink="/projets"
                routerLinkActive="text-foreground font-medium"
                class="text-muted-foreground hover:text-[#428EE0]"
                (click)="sheet.close()"
              >
                Projets
              </a>
              <a
                routerLink="/a-propos"
                routerLinkActive="text-foreground font-medium"
                class="text-muted-foreground hover:text-[#428EE0]"
                (click)="sheet.close()"
              >
                À propos
              </a>
              <a
                routerLink="/contact"
                routerLinkActive="text-foreground font-medium"
                class="text-muted-foreground hover:text-[#428EE0]"
                (click)="sheet.close()"
              >
                Contact
              </a>
              <a
                hlmBtn
                routerLink="/contact"
                class="mt-2 bg-[#428EE0] text-white hover:brightness-90"
                (click)="sheet.close()"
              >
                Me contacter
              </a>
            </nav>
          </hlm-sheet-content>
        </hlm-sheet>
      </div>
    </nav>
  </header>

  <main class="flex flex-1 flex-col">
    <router-outlet />
  </main>

  <footer class="relative">
    <div class="flex items-center justify-between px-6 py-3 md:px-10 lg:py-6">
      <div class="flex gap-3">
        <a
          href="https://www.linkedin.com/in/thomas-bruston-0401a7315/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          class="flex size-9 items-center justify-center rounded-full bg-[#428EE0] text-white hover:brightness-90"
        >
          <ng-icon name="faBrandLinkedinIn" size="16" />
        </a>
        <a
          href="https://github.com/thomas-bruston"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          class="flex size-9 items-center justify-center rounded-full bg-[#428EE0] text-white hover:brightness-90"
        >
          <ng-icon name="faBrandGithub" size="16" />
        </a>
      </div>

      <p class="text-sm text-muted-foreground">© {{ currentYear }} Thomas Bruston</p>
    </div>
  </footer>
</div>
